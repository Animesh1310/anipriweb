name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Configure website
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/anipriweb', github.repository_owner) }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
        run: node scripts/configure-site.mjs
      - name: Build static pages
        working-directory: web
        env:
          SITE_BASE_HREF: ${{ vars.SITE_BASE_HREF || '/anipriweb/' }}
        run: npm run build -- --base-href "$SITE_BASE_HREF"
      - name: Prepare Pages artifact
        run: |
          touch web/dist/web/browser/.nojekyll
          cp web/dist/web/browser/404/index.html web/dist/web/browser/404.html
      - name: Check generated routes
        run: node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
